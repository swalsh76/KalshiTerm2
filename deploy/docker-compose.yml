# Production stack: database + ingest + api.
# The `api` service (HTTPS, port 8700) is the ONLY thing published to the network. The database
# lives on an internal network with no route to the internet; only `ingest` can reach both it
# and Kalshi; only `api` holds the TLS key; only `ingest` holds the Kalshi key.
#
# First time (from this directory; see docs/PLAN.md §8.2):
#   KEY_FILE=~/.kalshiterm/server_key.pem docker compose -f docker-compose.setup.yml run --build --rm \
#     init --key-id <the server key's id> --host <name clients use> --ip <its LAN address>
#   docker compose up -d --build
#   docker compose exec ingest kterm-server status
#   docker compose exec api kterm-server user add <name>
#   docker compose exec api kterm-server token create --user <name> --role read
# On Linux add  --user "$(id -u):$(id -g)"  to the init command so the files are yours.
# Upgrades: git pull && docker compose up -d --build   (migrations run on startup)
name: kalshiterm

x-logging: &logging
  # Docker keeps container logs inside its VM disk; unbounded logs would eat the data budget.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: timescale/timescaledb:2.30.2-pg18 # keep equal to docker-compose.dev.yml (tested)
    # No usage reports to a third party from a private server.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run kterm-server init first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run kterm-server init first}
      POSTGRES_DB: ${POSTGRES_DB:?run kterm-server init first}
    volumes:
      # A named volume (inside Docker's VM disk, which lives on the external SSD), never a
      # bind mount from macOS. PostgreSQL 18 keeps PGDATA below /var/lib/postgresql.
      - kterm_pgdata:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 60s # let Postgres shut down cleanly
    logging: *logging

  ingest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kalshiterm-server:local
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        kterm-server db upgrade &&
        exec kterm-server ingest --watchlist /config/watchlist.toml --discover-every 900
    environment:
      KTERM_DB_URL: ${KTERM_DB_URL:?run kterm-server init first}
      KTERM_STORAGE_BUDGET_GB: ${KTERM_STORAGE_BUDGET_GB:-500}
      KTERM_HOST_STATE_FILE: ${KTERM_HOST_STATE_FILE:-/hoststate/host.json}
      KALSHI_ENV: ${KALSHI_ENV:-production}
      KALSHI_KEY_ID: ${KALSHI_KEY_ID:?run kterm-server init first}
      KALSHI_PRIVATE_KEY_PATH: ${KALSHI_PRIVATE_KEY_PATH:-/run/secrets/kalshi_key.pem}
    volumes:
      - ./secrets/kalshi_key.pem:/run/secrets/kalshi_key.pem:ro # the server's own Kalshi key
      - ./config:/config:ro # watchlist.toml (edit freely; re-read every 5 minutes)
      - ./state:/hoststate:ro # written by the host-side drive check
    networks: [internal, default]
    healthcheck:
      test: ["CMD", "kterm-server", "health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    stop_grace_period: 30s # drain buffered rows before exiting
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kalshiterm-server:local
    depends_on:
      db:
        condition: service_healthy
    command:
      - kterm-server
      - api
      - --host
      - 0.0.0.0
      - --port
      - "8700"
      - --tls-cert
      - /run/tls/cert.pem
      - --tls-key
      - /run/tls/key.pem
    environment:
      KTERM_DB_URL: ${KTERM_DB_URL:?run kterm-server init first}
      KTERM_STORAGE_BUDGET_GB: ${KTERM_STORAGE_BUDGET_GB:-500}
      KTERM_HOST_STATE_FILE: ${KTERM_HOST_STATE_FILE:-/hoststate/host.json}
      # deliberately no KALSHI_* settings: the API never holds the Kalshi key
    volumes:
      - ./secrets/tls_cert.pem:/run/tls/cert.pem:ro
      - ./secrets/tls_key.pem:/run/tls/key.pem:ro # the TLS key, and only that, is mounted here
      - ./state:/hoststate:ro
    ports:
      - "${KTERM_API_PORT:-8700}:8700" # the only published port
    networks: [internal, default]
    healthcheck:
      # The certificate is self-signed, so this check (inside the container) does not verify it.
      test:
        - CMD
        - python
        - -c
        - >-
          import ssl, sys, urllib.request;
          c = ssl._create_unverified_context();
          sys.exit(0 if urllib.request.urlopen('https://127.0.0.1:8700/readyz', context=c, timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *logging

networks:
  internal:
    internal: true # no route to the internet; the database is never reachable from outside

volumes:
  kterm_pgdata:
