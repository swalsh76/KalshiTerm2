# Development database only. Production uses the compose file written by `kterm-server init`.
# Separate project name so dev containers/volumes never mix with production ones.
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   KTERM_DB_URL=postgresql+asyncpg://kterm:kterm_dev_only@127.0.0.1:5433/kterm \
#     uv run kterm-server db upgrade
name: kalshiterm-dev

services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg18
    # No usage reports to a third party from a private server (also keeps `status` honest:
    # the built-in telemetry job fails on a network without internet access).
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_USER: ${KTERM_DB_USER:-kterm}
      POSTGRES_PASSWORD: ${KTERM_DB_PASSWORD:-kterm_dev_only} # dev only; never reuse
      POSTGRES_DB: ${KTERM_DB_NAME:-kterm}
    ports:
      - "127.0.0.1:${KTERM_DB_PORT:-5433}:5432" # loopback only
    volumes:
      # PostgreSQL 18 images keep PGDATA in a versioned subdirectory of /var/lib/postgresql
      # (older majors used /var/lib/postgresql/data). Mount the parent or data is NOT persisted.
      - kterm_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  kterm_pgdata:
