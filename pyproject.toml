[project]
name = "kalshiterm-workspace"
version = "0.0.0"
description = "KalshiTerm2 workspace root (not published)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "kalshi-core",
    "kalshiterm-server",
    "kalshiterm-client",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kalshi-core = { workspace = true }
kalshiterm-server = { workspace = true }
kalshiterm-client = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = [
    "packages/kalshi-core/src",
    "packages/kalshiterm-server/src",
    "packages/kalshiterm-client/src",
]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
