[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalshi-core"
version = "0.0.0"
description = "Kalshi API SDK"
readme = "README.md"
license = "MIT"
license-files = ["../../LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8", "pydantic-settings>=2.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_core"]
