[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalshiterm-server"
version = "0.0.0"
description = "KalshiTerm server: ingestion, analytics, API"
readme = "README.md"
license = "MIT"
license-files = ["../../LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "kalshi-core",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
kterm-server = "kalshiterm_server.cli:app"

# Built-in analyzers are registered exactly like third-party ones (BUILD-LOG §10.5)
[project.entry-points."kalshiterm.analyzers"]
market_quotes = "kalshiterm_server.analytics.builtin.market_metrics:MarketQuotes"
market_moves = "kalshiterm_server.analytics.builtin.market_metrics:MarketMoves"
market_volatility = "kalshiterm_server.analytics.builtin.market_metrics:MarketVolatility"
arbitrage_bid = "kalshiterm_server.analytics.builtin.arbitrage:ArbitrageBid"
alert_evaluator = "kalshiterm_server.analytics.builtin.alert_evaluator:AlertEvaluator"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshiterm_server"]

[tool.uv.sources]
kalshi-core = { workspace = true }
