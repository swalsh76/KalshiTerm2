# Keeps the pinned things current without burying a solo maintainer: monthly, a few open pull
# requests at a time, minor and patch updates grouped. Nothing here merges by itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: docker # the base image and the pinned uv image in deploy/Dockerfile
    directory: /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: npm # the web UI's front end
    directory: /packages/kalshiterm-client/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint accepts typescript >=4.8.4 <6.1.0 and openapi-typescript only ^5.x, so
      # Dependabot's jump to TypeScript 7 cannot resolve and made the whole npm run fail
      # (2026-10-15). Revisit when both support a newer TypeScript.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv # the Python workspace (uv.lock)
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
